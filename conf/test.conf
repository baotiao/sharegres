[global]
listen_addr = 0.0.0.0
listen_port = 15432
log_level = debug

[pool]
default_pool_size = 5
max_pool_size = 20

[backend]
conninfo = host=127.0.0.1 port=5432 dbname=postgres

[shard:shard_0]
conninfo = host=127.0.0.1 port=5432 dbname=postgres
key_range_start = 0
key_range_end = 1000000

[shard:shard_1]
conninfo = host=127.0.0.1 port=5432 dbname=postgres
key_range_start = 1000000
key_range_end = 2000000

[table:orders]
shard_column = user_id
method = range
shards = shard_0, shard_1
